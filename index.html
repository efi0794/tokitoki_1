<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SECURITY DESKTOP | ハタンボ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="desktop" class="desktop" aria-label="研修用デスクトップ">
    <div class="noise"></div>
    <aside class="desktop-icons" aria-label="デスクトップアイコン">
      <button class="desktop-icon" data-open="mail"><img src="assets/mail.png" alt=""><span>メール</span><b id="mailBadge">1</b></button>
      <button class="desktop-icon" data-open="browser"><img src="assets/WaterDog.png" alt=""><span>ブラウザ</span></button>
      <button class="desktop-icon" data-open="files"><img src="assets/folder.png" alt=""><span>会議資料</span></button>
      <button class="desktop-icon" data-open="trash"><img src="assets/dustbox.png" alt=""><span>ごみ箱</span></button>
      <button class="desktop-icon ai-icon" data-open="assistant"><img src="assets/AI.png" alt=""><span>ハタンボAI</span></button>
    </aside>

    <section class="hero-status" aria-label="研修状況">
      <p class="eyebrow">MIRAI LINK / EMPLOYEE TERMINAL</p>
      <h1>SECURITY<br>ORIENTATION</h1>
      <p id="statusCopy">新着メールを確認して、研修を開始してください。</p>
      <div class="system-line"><i></i><span id="clock">17:30:00</span><span>NETWORK: PROTECTED</span></div>
    </section>

    <div id="notification" class="notification show" role="status">
      <img src="assets/mail.png" alt="">
      <div><strong>新着メール</strong><p>情報システム部：研修用ソフトのご案内</p></div>
    </div>

    <section id="window" class="window hidden" aria-live="polite">
      <header class="titlebar">
        <div><span class="traffic red"></span><span class="traffic yellow"></span><span class="traffic green"></span></div>
        <strong id="windowTitle">MAIL</strong>
        <button id="closeWindow" aria-label="閉じる">×</button>
      </header>
      <div id="windowBody" class="window-body"></div>
    </section>

    <section id="infection" class="infection hidden" aria-label="ウイルス感染演出">
      <div class="glitch-title" data-text="SYSTEM COMPROMISED">SYSTEM COMPROMISED</div>
      <div id="popupField"></div>
      <button id="callAssistant" class="panic-button">ハタンボを起動</button>
    </section>

    <section id="mission" class="mission hidden">
      <header class="mission-header">
        <div class="brand"><img src="assets/AI.png" alt="ハタンボ"><div><b>HATANBO AI</b><span>RECOVERY ASSISTANT</span></div></div>
        <div class="progress-wrap"><span id="progressLabel">0 / 6</span><div class="progress"><i id="progressBar"></i></div></div>
      </header>
      <div class="mission-grid">
        <aside class="assistant-panel">
          <img src="assets/AI.png" alt="ハタンボ">
          <div class="speech"><span>GUIDANCE</span><p id="assistantText">端末を復旧するには、6つのセキュリティログを調査する必要があります。</p></div>
          <button id="hintButton">ヒントを見る</button>
        </aside>
        <article id="puzzleArea" class="puzzle-area"></article>
      </div>
    </section>

    <footer class="taskbar">
      <button class="start">◇</button><span>SECURE OS</span><div></div><span id="taskClock">17:30</span>
    </footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
